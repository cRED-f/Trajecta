[package]
name = "trajecta-desktop"
version = "0.1.0"
description = "Trajecta desktop agent"
authors = ["Trajecta"]
license = "MIT"
edition = "2021"

[lib]
name = "trajecta_desktop_lib"
crate-type = [
    "staticlib",
    "cdylib",
    "rlib"
]

[build-dependencies]
tauri-build = {
    version = "2",
    features = []
}

[dependencies]
tauri = {
    version = "2",
    features = ["tray-icon"]
}

tauri-plugin-single-instance = "2"

tauri-plugin-opener = "=2.5.5"

tauri-plugin-dialog = "=2.7.3"

serde = {
    version = "1",
    features = ["derive"]
}

serde_json = "1"
