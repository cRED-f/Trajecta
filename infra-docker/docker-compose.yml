# Trajecta local dev stack.
#
# `langgraph` — Deep Agents memory server (episodic threads, /memories/, /skills/).
# Served by `langgraph dev`; the Trajecta server queries it via langgraph-sdk.
#
# Usage:  docker compose -f docker/docker-compose.yml up langgraph

services:
  langgraph:
    build:
      context: ..
      dockerfile: docker/langgraph/Dockerfile
    ports:
      - "2024:2024"
    volumes:
      - trajecta-data:/data # langgraph.db persists across restarts
    environment:
      - TRAJECTA_LANGGRAPH_DB=/data/langgraph.db

volumes:
  trajecta-data:
