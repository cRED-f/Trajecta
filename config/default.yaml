# Trajecta Default Configuration
# Override with environment variables or .trajecta/config.yaml

server:
  host: "127.0.0.1"
  port: 8420

llm:
  # Bifrost sidecar: set TRAJECTA_BIFROST_URL or fill base_url below.
  # When Bifrost is configured, it handles routing/failover — individual
  # provider entries below are ignored.
  # Bifrost uses `/` model separator: openai/gpt-4o-mini, anthropic/claude-sonnet-4-6
  default_provider: "9_router"
  providers:
    bifrost:
      enabled: false
      base_url: "http://127.0.0.1:8080" # Bifrost HTTP sidecar
    openai:
      enabled: true
      model: "openai:gpt-5.5"
    anthropic:
      enabled: false
      model: "anthropic:claude-sonnet-4-6"
    ollama:
      enabled: false
      base_url: "http://localhost:11434"
      model: "ollama:north-mini-code-1.0"
    omni_route:
      enabled: false
    9_router:
      enabled: true
      base_url: "http://localhost:20128/v1"
      model: "claude-opus-free" # default; overridable via TRAJECTA_9_ROUTER_MODEL
      model_env: "TRAJECTA_9_ROUTER_MODEL"
      # API key via TRAJECTA_9_ROUTER_API_KEY env var (see .env.example)
    openai_compat:
      enabled: false
      base_url: ""
      model: ""

memory:
  db_path: ".trajecta/data/trajecta.db"
  langgraph_db_path: ".trajecta/data/langgraph.db"
  langgraph_server_url: "http://127.0.0.1:2024"
  memory_files: ["/memories/AGENTS.md"]
  skills_path: "/skills/"
  vector_store:
    enabled: true
    mode: "embedded"
    path: ".trajecta/data/qdrant"
    collection_prefix: "trajecta_"

skills:
  storage_path: ".trajecta/skills"
  evaluation:
    min_samples: 3
    confidence_threshold: 0.8

guardrails:
  default_risk_level: "SENSITIVE"
  rules_path: "config/guardrail-rules.yaml"

sandbox:
  enabled: true
  image: "trajecta-sandbox:latest"
  timeout_seconds: 300
  memory_limit: "512m"
  cpu_limit: "1.0"

chat:
  uploads_path: ".trajecta/uploads"
  default_model: "9router/claude-opus-free"
  max_upload_mb: 100
  max_extracted_chars: 2000000
  stream_heartbeat_seconds: 15
  rag:
    enabled: true
    chunk_size_chars: 3000
    chunk_overlap_chars: 400
    auto_index_min_chars: 4000
    top_k: 8
    max_tool_chars: 24000

tools:
  mcp_servers: {}

  # Example:
  #
  # mcp_servers:
  #   langchain_docs:
  #     url: "https://docs.langchain.com/mcp"
  #
  # local_tools:
  #   command: "python"
  #   args:
  #     - "tools/local_server.py"

  discovery_timeout_seconds: 15

observability:
  enabled: true
  otlp_endpoint: "http://localhost:4317"
  service_name: "trajecta"

evals:
  deep_eval_project: "trajecta"
  results_path: "evals/results"
