# Trajecta Default Configuration
# Override with environment variables or .trajecta/config.yaml

server:
  host: "127.0.0.1"
  port: 8420

llm:
  # Bifrost sidecar: set TRAJECTA_BIFROST_URL or fill base_url below.
  # When Bifrost is configured, it handles routing/failover — individual
  # provider entries below are ignored.
  # Bifrost uses `/` model separator: openai/gpt-4o-mini, anthropic/claude-sonnet-4-6
  default_provider: "9_router"
  providers:
    bifrost:
      enabled: true
      base_url: "http://127.0.0.1:8080" # Bifrost HTTP sidecar
    openai:
      enabled: true
      model: "openai:gpt-5.5"
    anthropic:
      enabled: false
      model: "anthropic:claude-sonnet-4-6"
    ollama:
      enabled: false
      base_url: "http://localhost:11434"
      model: "ollama:north-mini-code-1.0"
    omni_route:
      enabled: false
    9_router:
      enabled: true
      base_url: "http://localhost:20128/v1"
      model: "claude-opus-free" # default; overridable via TRAJECTA_9_ROUTER_MODEL
      model_env: "TRAJECTA_9_ROUTER_MODEL"
      # API key via TRAJECTA_9_ROUTER_API_KEY env var (see .env.example)
    openai_compat:
      enabled: false
      base_url: ""
      model: ""

memory:
  db_path: ".trajecta/data/trajecta.db"
  langgraph_db_path: ".trajecta/data/langgraph.db"
  langgraph_server_url: "http://127.0.0.1:2024"
  memory_files: ["/memories/AGENTS.md"]
  skills_path: "/skills/"
  vector_store:
    enabled: true
    mode: "embedded"
    path: ".trajecta/data/qdrant"
    collection_prefix: "trajecta_"

skills:
  storage_path: ".trajecta/skills"

  learning:
    enabled: true

    # Run learning after every 4 newly successful trajectories.
    trigger_every_successes: 4

    scan_limit: 200
    minimum_occurrences: 4

    sequence_similarity: 0.72
    goal_similarity: 0.18

    max_candidates_per_run: 3

    # null = normal Bifrost/default model resolution
    model_name: null

    auto_evaluate: true
    auto_promote_initial: true
    auto_experiment_upgrades: true

  experiments:
    enabled: true

    default_strategy: "ab"

    treatment_traffic_percent: 25

    relevance_threshold: 0.12

    min_samples_per_arm: 20
    max_samples_total: 200

    alpha: 0.05
    bayesian_threshold: 0.95

    minimum_success_effect: 0.03
    harm_effect: 0.05

    bayesian_draws: 5000

    auto_stop: true
    auto_promote_winner: true

  regression:
    enabled: true

    min_samples_per_version: 20
    window_size: 100

    success_drop: 0.08

    alpha: 0.05
    bayesian_harm_threshold: 0.95

    maximum_latency_ratio: 1.5
    maximum_tool_error_rate_increase: 0.10

    auto_rollback: true

  fixtures:
    enabled: true
    root: ".trajecta/data/replay-fixtures"
    capture_workspace: true
    max_files: 1000
    max_file_mb: 8
    max_total_mb: 100
    exclude_globs:
      - ".git/**"
      - ".trajecta/**"
      - "node_modules/**"
      - ".venv/**"
      - "venv/**"
      - "__pycache__/**"
      - ".pytest_cache/**"
      - ".mypy_cache/**"
      - ".ruff_cache/**"
      - "dist/**"
      - "build/**"

guardrails:
  default_risk_level: "SENSITIVE"
  rules_path: "config/guardrail-rules.yaml"
  hitl_enabled: true

  content:
    enabled: true

    prompt_injection_enabled: true
    prompt_injection_heuristic_threshold: 0.75

    # User-written prompts are not blindly rejected.
    user_prompt_action: "warn"

    # Tool / web / attachment / RAG output is untrusted data.
    untrusted_content_action: "block"

    jailbreak_enabled: false
    jailbreak_threshold: 0.90

    secrets_enabled: true

    pii_enabled: true
    pii_entities:
      - "EMAIL_ADDRESS"
      - "PHONE_NUMBER"
      - "CREDIT_CARD"
      - "IBAN_CODE"
      - "IP_ADDRESS"
      - "US_SSN"
      - "US_BANK_NUMBER"

    # Providers with this prefix are considered local/private.
    local_providers:
      - "ollama"

    # For non-local providers:
    # allow | redact | block
    cloud_sensitive_action: "redact"

    system_prompt_leakage_enabled: true
    system_prompt_leakage_threshold: 40

sandbox:
  enabled: true
  image: "trajecta-sandbox:latest"
  timeout_seconds: 300
  memory_limit: "512m"
  cpu_limit: 1.0
  network_enabled: false
  auto_remove: true

chat:
  uploads_path: ".trajecta/uploads"
  # First-run fallback only. The user-selected default is persisted
  # in agent_settings ("llm.runtime") and wins for new conversations.
  default_model: "9router/claude-opus-free"
  max_upload_mb: 100
  max_extracted_chars: 2000000
  stream_heartbeat_seconds: 15
  rag:
    enabled: true
    chunk_size_chars: 3000
    chunk_overlap_chars: 400
    auto_index_min_chars: 4000
    top_k: 8
    max_tool_chars: 24000

tools:
  workspace_root: "."
  web:
    enabled: true
    # Recommended: run your own free SearXNG instance and set this URL.
    searxng_url: null
    request_timeout_seconds: 20
    max_response_bytes: 2000000
  browser:
    enabled: true
    headless: false
    browser: "chromium"
    default_timeout_ms: 20000
    downloads_path: ".trajecta/downloads"
  computer:
    # Full host desktop control is opt-in.
    enabled: false
    screenshot_path: ".trajecta/screenshots"
  scheduler:
    enabled: true
    poll_seconds: 5

  mcp_servers: {}

  # Example:
  #
  # mcp_servers:
  #   langchain_docs:
  #     url: "https://docs.langchain.com/mcp"
  #
  # local_tools:
  #   command: "python"
  #   args:
  #     - "tools/local_server.py"

  discovery_timeout_seconds: 15

  # Independent read-back verification for mutating connector (MCP) tools.
  # An action is never considered verified from its own return value.
  connector_verification:
    enabled: true
    fail_closed: true

    rules: {}

    http_rules: {}

observability:
  enabled: true
  otlp_endpoint: "http://localhost:4317"
  service_name: "trajecta"

evals:
  deep_eval_project: "trajecta"
  results_path: "evals/results"
