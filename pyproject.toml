[tool.poetry]
name = "trajecta"
version = "0.1.0"
description = "Local-first autonomous desktop agent that learns reusable skills from successful task trajectories"
license = "MIT"
authors = ["Trajecta"]
readme = "README.md"
packages = [{include = "server", from = "."}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.53.0"}
pydantic = "^2.13.5"
pyyaml = "^6.0"
pydantic-settings = "^2.15.0"
langchain = { version = "^1.4.0", extras = ["mcp"] }
langchain-core = "^1.6.3"
langchain-community = "^0.4.2"
langgraph = "^1.2.11"
# LangGraph SQLite checkpointer/store are distributed separately from langgraph.
langgraph-checkpoint-sqlite = "^3.1.1"
langgraph-sdk = "^0.4.4"
deepagents = "^0.7.13"
guardrails-ai = "^0.11.0"

guardrails-ai-detect-prompt-injection = "0.2.1a1"
guardrails-ai-secrets-present = "0.1.0"
guardrails-ai-detect-pii = "0.0.6"
guardrails-ai-valid-json = "0.1.0"

# Optional heavier local classifier.
guardrails-ai-detect-jailbreak = "0.1.6"
opentelemetry-api = "^1.44.0"
opentelemetry-sdk = "^1.44.0"
opentelemetry-exporter-otlp = "^1.44.0"
opentelemetry-instrumentation-fastapi = "^0.65b0"
# Guardrails AI 0.11.x requires OpenAI <3, while langchain-openai 1.6.x needs >=2.45.
# Keep the compatible intersection until both integrations support OpenAI 3.
openai = ">=2.45.0,<3.0.0"
anthropic = "^1.5.0"
httpx = "^0.28.1"
aiosqlite = "^0.22.1"
qdrant-client = "^1.19.0"
deepeval = "^4.2.2"
langchain-openai = "^1.6.2"
# LangChain MCP/FastMCP 4 requires python-multipart >=0.0.26.
# Poetry ^0.0.12 restricts resolution to <0.0.13 and prevents installation.
python-multipart = ">=0.0.26,<1.0.0"
# Latest published python-docx is 1.2.0; do not require non-existent 1.2.2.
python-docx = "^1.2.0"
pypdf = "^5.9.0"
# Free/local personal-agent tool dependencies
beautifulsoup4 = "*"
feedparser = "*"
croniter = "*"
playwright = "*"
pyautogui = "*"
pyperclip = "*"
psutil = "*"
openpyxl = "*"
python-pptx = "*"
pillow = "*"
pytesseract = "*"
pyttsx3 = "*"
faster-whisper = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
ruff = "^0.16.7"
mypy = "^2.3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
